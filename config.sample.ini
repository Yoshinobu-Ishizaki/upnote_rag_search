[settings]
# Path to your UpNote backup directory containing the "data" folder.
UPNOTE_BACKUP_PATH=
# Default number of top results to return for search queries.
TOP_K_RESULTS=10
# Maximum context characters to use for AI processing.
MAX_CONTEXT_CHARS=50000
# Claude model to use for AI processing.
CLAUDE_MODEL=claude-haiku-4-5-20251001
# Available models (uncomment to use):
# CLAUDE_MODEL=claude-sonnet-5
# CLAUDE_MODEL=claude-opus-5
# Embedding provider to use for generating embeddings. Choices: local, google
EMBEDDING_PROVIDER=local
# EMBEDDING_PROVIDER=google
# Automatically preprocess notes on app start (true/false).
AUTO_PREPROCESS=false
# Default date filter condition on app start.
# Choices: すべて (all), 以前 (before), 以降 (after), 範囲 (range)
DEFAULT_DATE_MODE=すべて
# Comma-separated list of categories to pre-select by default (empty = all).
DEFAULT_CATEGORIES=
# Comma-separated list of tags to pre-select by default (empty = all).
DEFAULT_TAGS=
# Default start date (YYYY-MM-DD). Used for 以降 and 範囲 modes. Empty = 2010-01-01.
DEFAULT_START_DATE=2010-01-01
# Default end date (YYYY-MM-DD). Used for 以前 and 範囲 modes. Empty = today.
DEFAULT_END_DATE=
